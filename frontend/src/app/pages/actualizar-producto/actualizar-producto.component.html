<div class="p-6 max-w-4xl mx-auto">

  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Actualizar Producto</h1>
  </div>

    <!-- 0. Buscador de producto por código de barras -->
    <div class="mb-6 flex items-center space-x-2">
      

      <input
        #codigoBarrasInput
        type="text"
        [(ngModel)]="codigoBarras"
        placeholder="Escanea o ingresa código"
        (keyup.enter)="buscarProducto()"
        class="flex-1 border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <button
        (click)="buscarProducto()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition"
      >
        Buscar
      </button>
    </div>
  
    <!-- Mensaje cuando no encuentra -->
    <p
      *ngIf="!productoEncontrado && busqueda"
      class="text-red-600 mb-4"
    >
      Producto no encontrado.
    </p>
  
    <!-- 1. Tarjeta: solo aparece si productFound === true -->
    <div *ngIf="productoEncontrado" class="bg-white rounded-xl shadow-lg overflow-hidden">
  
      <!-- 2. Formulario -->
      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        class="px-6 py-4 grid grid-cols-1 md:grid-cols-2 gap-6"
      >
        <!-- Columna Izquierda -->
        <div class="space-y-4">
          <!-- Nombre -->
          <div>
            <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
            <input
              id="nombre"
              type="text"
              formControlName="nombre"
              class="block w-full border border-gray-500 rounded-md px-3 py-2
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600"
            />
            <p class="mt-0.5 text-sm text-red-600 h-5">
              <ng-container *ngIf="form.get('nombre')?.touched && form.get('nombre')?.invalid">
                El nombre es obligatorio.
              </ng-container>
            </p>
          </div>
  
          <!-- Descripción -->
          <div>
            <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
            <textarea
              id="descripcion"
              rows="4"
              formControlName="descripcion"
              class="block w-full border border-gray-500 rounded-md px-3 py-2
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600 resize-none"
            ></textarea>
          </div>

        </div>
  
        <!-- Columna Derecha -->
        <div class="space-y-4">
          <!-- Precios -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="precioCompra" class="block text-sm font-medium text-gray-700 mb-1">
                Precio Compra
              </label>
              <input
                #precioCompraInput
                id="precioCompra"
                type="text"
                formControlName="precioCompra"
                (input)="formatPrecio($event)"
                class="block w-full border border-gray-500 rounded-md px-3 py-2
                       focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600"
              />
              <p class="mt-0.5 text-sm text-red-600 h-5">
                <ng-container *ngIf="form.get('precioCompra')?.touched && form.get('precioCompra')?.invalid">
                    Precio de compra inválido.
                </ng-container>
              </p>
            </div>
            <div>
              <label for="precioVenta" class="block text-sm font-medium text-gray-700 mb-1">
                Precio Venta
              </label>
              <input
                #precioVentaInput
                id="precioVenta"
                type="text"
                formControlName="precioVenta"
                (input)="formatPrecio($event)"
                class="block w-full border border-gray-500 rounded-md px-3 py-2
                       focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600"
              />
              <p class="mt-0.5 text-sm text-red-600 h-5">
                <ng-container *ngIf="form.get('precioVenta')?.touched && form.get('precioVenta')?.invalid">
                    Precio de venta inválido.
                </ng-container>
              </p>
            </div>
          </div>
  
          <!-- Unidad -->
          <div>
            <label for="unidad" class="block text-sm font-medium text-gray-700 mb-1">Unidad</label>
            <select
              id="unidad"
              formControlName="unidad"
              [compareWith]="compararUnidad"
              class="block w-full border border-gray-500 rounded-md px-3 py-2
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600"
            >
              <option [ngValue]="null" disabled>-- Selecciona unidad --</option>
              <option *ngFor="let u of unidades" [ngValue]="u">{{ u.nombre }}</option>
            </select>
          </div>
        </div>
  
        <!-- Botones (ancho completo) -->
        <div class="col-span-1 md:col-span-2 flex justify-end space-x-4 pt-4 border-t border-gray-200">
          <button
            type="button"
            (click)="onCancel()"
            class="px-5 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="px-5 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition"
          >
            Guardar Cambios
          </button>
        </div>
      </form>
    </div>
  </div>
