<div class="p-6 max-w-4xl mx-auto">

  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Crear Producto</h1>
  </div>
    <!-- Tarjeta -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="px-6 py-4 grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Columna Izquierda -->
        <div class="space-y-4">
          <!-- Nombre -->
          <div>
            <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
            <input
              id="nombre"
              type="text"
              formControlName="nombre"
              class="block w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600"
            />
            <p class="mt-0.5 text-sm text-red-600 h-5">
                <ng-container *ngIf="form.get('nombre')?.touched && form.get('nombre')?.invalid">
                  El nombre es obligatorio.
                </ng-container>
              </p>
          </div>
          <!-- Descripción -->
          <div>
            <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
            <textarea
              id="descripcion"
              rows="4"
              formControlName="descripcion"
              class="block w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600 resize-none"
            ></textarea>
          </div>
          <!-- Código de Barras -->
          <div>
            <label for="codigoBarras" class="block text-sm font-medium text-gray-700 mb-1">Código de Barras</label>
            <input
              id="codigoBarras"
              type="text"
              formControlName="codigoBarras"
              class="block w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600"
            />
            <p class="mt-0.5 text-sm text-red-600 h-5">
                <ng-container *ngIf="form.get('codigoBarras')?.touched && form.get('codigoBarras')?.invalid">
                    El código de barras es obligatorio.
                </ng-container>
              </p>
          </div>
        </div>
  
        <!-- Columna Derecha -->
        <div class="space-y-4">
          <!-- Precios -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="precioCompra" class="block text-sm font-medium text-gray-700 mb-1">Precio Compra</label>
              <input
                id="precioCompra"
                type="text"
                formControlName="precioCompra"
                (input)="formatPrecio($event)"
                class="block w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600"
              />
              <p class="mt-0.5 text-sm text-red-600 h-5">
                <ng-container *ngIf="form.get('precioCompra')?.touched && form.get('precioCompra')?.invalid">
                    Precio de compra inválido.
                </ng-container>
              </p>
            </div>
            <div>
              <label for="precioVenta" class="block text-sm font-medium text-gray-700 mb-1">Precio Venta</label>
              <input
                id="precioVenta"
                type="text"
                formControlName="precioVenta"
                (input)="formatPrecio($event)"
                class="block w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600"
              />
              <p class="mt-0.5 text-sm text-red-600 h-5">
                <ng-container *ngIf="form.get('precioVenta')?.touched && form.get('precioVenta')?.invalid">
                    Precio de venta inválido.
                </ng-container>
              </p>
            </div>
          </div>
          <!-- Cantidad -->
          <div>
            <label for="cantidad" class="block text-sm font-medium text-gray-700 mb-1">Cantidad Inicial</label>
            <input
              id="cantidad"
              type="number"
              formControlName="cantidad"
              min="0"
              class="block w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600"
            />
            <p class="mt-0.5 text-sm text-red-600 h-5">
                <ng-container *ngIf="form.get('cantidad')?.touched && form.get('cantidad')?.invalid">
                    Cantidad inválida.
                </ng-container>
              </p>
          </div>
          <!-- Unidad -->
          <div>
            <label for="unidad" class="block text-sm font-medium text-gray-700 mb-1">Unidad</label>
            <select
              id="unidad"
              formControlName="unidad"
              class="block w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600"
            >
              <option [ngValue]="null" disabled>-- Selecciona unidad --</option>
              <option *ngFor="let u of unidades" [ngValue]="u">{{ u.nombre }}</option>
            </select>
            <p class="mt-0.5 text-sm text-red-600 h-5">
                <ng-container *ngIf="form.get('unidad')?.touched && form.get('unidad')?.invalid">
                    Debes seleccionar una unidad.
                </ng-container>
              </p>
          </div>
        </div>
  
        <!-- Botones (ancho completo) -->
        <div class="col-span-1 md:col-span-2 flex justify-end space-x-4 pt-4 border-t border-gray-200">
          <button
            type="button"
            (click)="onCancel()"
            class="px-5 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="form.invalid"
            class="px-5 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition disabled:opacity-50"
          >
            Crear Producto
          </button>
        </div>
      </form>
    </div>
  </div>
