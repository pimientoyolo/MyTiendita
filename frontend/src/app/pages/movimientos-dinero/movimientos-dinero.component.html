<div class="p-6 max-w-4xl mx-auto">

  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Registrar Movimiento</h1>
  </div>

    <!-- Tarjeta -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">

      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        class="px-6 py-4 grid grid-cols-1 md:grid-cols-2 gap-6"
      >
        <!-- Cantidad -->
        <div>
          <label
            for="monto"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Cantidad</label
          >
          <input
            id="monto"
            type="text"
            formControlName="monto"
            (input)="formatPrecio($event)"
            placeholder="0"
            class="block w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600"
          />
          <p class="mt-0.5 text-sm text-red-600 h-5">
            <ng-container
              *ngIf="
                form.get('monto')?.touched &&
                form.get('monto')?.invalid
              "
            >
              {{ form.get('monto')?.hasError('required')
                ? 'La cantidad es obligatoria.'
                : 'Formato inválido (solo dígitos).' }}
            </ng-container>
          </p>
        </div>
  
        <!-- Tipo de Movimiento -->
        <div>
          <label
            for="tipoMovimientoId"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Tipo de Movimiento</label
          >
          <select
            id="tipoMovimientoId"
            formControlName="tipoMovimientoId"
            class="block w-full border border-gray-500 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-600"
          >
            <option [ngValue]="null" disabled>-- Seleccione --</option>
            <option
              *ngFor="let t of tiposMovimientos"
              [ngValue]="t.id"
            >
              {{ t.nombre }}
            </option>
          </select>
          <p class="mt-0.5 text-sm text-red-600 h-5">
            <ng-container
              *ngIf="
                form.get('tipoMovimientoId')?.touched &&
                form.get('tipoMovimientoId')?.invalid
              "
            >
              Debes elegir un tipo.
            </ng-container>
          </p>
        </div>
  
        <!-- Botones (span 2 columnas) -->
        <div
          class="col-span-1 md:col-span-2 flex justify-end space-x-4 pt-4 border-t border-gray-200"
        >
          <button
            type="button"
            (click)="onCancel()"
            class="px-5 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="form.invalid"
            class="px-5 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition disabled:opacity-50"
          >
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
