<div class="p-4 space-y-4">

    <!-- 1. Formulario de búsqueda de código de barras -->
    <div class="flex items-center gap-2">
        <input #codigoBarrasInput type="text" placeholder="Escanea o ingresa código" [(ngModel)]="codigoBarras"
            name="codigoBarras" (keyup.enter)="getProductoByCodigoBarras()"
            class="flex-1 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <button (click)="getProductoByCodigoBarras()"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
            Agregar Producto
        </button>
    </div>

    <!-- 2. Tabla de productos agregados -->
    <div  class="flex-1 overflow-y-auto">
        <h2 class="text-xl font-semibold mb-2">Productos Agregados</h2>
        <div class="max-h-[50vh] overflow-auto border border-gray-200 rounded">
            <table class="min-w-full bg-white border border-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Nombre</th>
                        <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Precio</th>
                        <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Cantidad</th>
                        <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">SubTotal</th>
                        <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let prod of listaProductos" class="hover:bg-gray-50">
                        <td class="px-4 py-2 border-t text-sm text-gray-800">{{ prod.producto.nombre }}</td>
                        <td class="px-4 py-2 border-t text-sm text-gray-800">{{ prod.producto.precioVenta }}</td>
                        <td class="px-4 py-2 border-t text-sm text-gray-800">{{ prod.cantidad }}</td>
                        <td class="px-4 py-2 border-t text-sm text-gray-800">{{ prod.subtotal }}</td>
                        <td class="px-4 py-2 border-t text-sm text-gray-800 space-x-2">
                            <!-- Disminuir -->
                            <button (click)="disminuirCantidad(prod)"
                                class="px-2 py-1 rounded bg-gray-200 hover:bg-gray-300 text-gray-700" title="Disminuir">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-600" fill="none"
                                    viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M18 12H6" />
                                </svg>
                            </button>
                            <!-- Aumentar -->
                            <button (click)="incrementarCantidad(prod)"
                                class="px-2 py-1 rounded bg-gray-200 hover:bg-gray-300 text-gray-700" title="Aumentar">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-600" fill="none"
                                    viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 6v12m6-6H6" />
                                </svg>
                            </button>
                            <!-- Eliminar -->
                            <button (click)="eliminarProducto(prod)"
                                class="px-2 py-1 rounded bg-red-200 hover:bg-red-300 text-red-700" title="Eliminar">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-red-600" fill="none"
                                    viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </td>
                    </tr>
                    <tr *ngIf="listaProductos.length === 0">
                        <td colspan="3" class="px-4 py-4 text-center text-gray-500">No hay productos agregados.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 3. Total y botones -->
        <div class="mt-6 pt-4 border-t border-gray-200 flex justify-end items-center space-x-4">
            <!-- Total -->
            <span class="text-xl font-semibold">
                Total: {{ total | currency:'COP ':'symbol':'1.0-0' }}
            </span>

            <!-- Proceder Venta -->
            <button (click)="procesoVenta()"
                class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">
                Proceder Venta
            </button>

            <!-- Cancelar -->
            <button (click)="cancelarVenta()"
                class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition">
                Cancelar
            </button>
        </div>
    </div>

</div>
