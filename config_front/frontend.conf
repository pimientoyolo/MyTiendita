server {
    # Escucha únicamente en la IP de la VPN (por ejemplo, 10.8.0.1)
    listen 10.8.0.1:80;
    server_name _;

    # Directorio raíz con los archivos compilados
    root /var/www/frontend/browser;
    index index.html;

    # Configuración para el frontend Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ejemplo: Proxy para llamadas a la API (ajusta según sea necesario)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
